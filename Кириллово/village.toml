# Настройки селения для verso — только то, что читают команды этого репозитория.
schema = 1

[census]
# Порядок наборов переписей в выводе (consolidated_unions.tf) — тот, что писал прежний
# генератор (до Ф5 — таблица в geni/pipeline/load.py, до неё — Журавкино/generate_config.py).
# Набор вне списка идёт после списка, по году. Поменять порядок — сдвинуть союзы в выводе.
# Ревизия 1850 стоит первой: так её ставила общая таблица, где она была ради Журавкина.
order = [{ year = 1850 }]
